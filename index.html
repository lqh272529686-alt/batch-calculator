<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>批次计算器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif; }
        body { background-color: #f5f5f7; padding: 16px; color: #1d1d1f; }
        .card { background: #ffffff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
        h2 { font-size: 20px; text-align: center; margin-bottom: 16px; color: #111; }
        .form-group { display: flex; align-items: center; margin-bottom: 12px; }
        .form-group label { width: 35%; font-size: 14px; font-weight: 600; color: #333; }
        .form-group input { width: 65%; padding: 10px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; outline: none; background: #fafafa; }
        .form-group input:focus { border-color: #2b5c8f; background: #fff; }
        .btn-calc { width: 100%; padding: 12px; background-color: #2b5c8f; color: white; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; margin-top: 8px; cursor: pointer; }
        .btn-calc:active { background-color: #1e4066; }
        .tip { font-size: 12px; color: #666; text-align: center; margin: 12px 0 8px 0; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 16px; border-radius: 20px; font-size: 13px; display: none; z-index: 1000; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; text-align: center; font-size: 14px; }
        th { background: #eef2f7; padding: 10px 4px; font-weight: bold; color: #333; border-bottom: 2px solid #ddd; }
        td { padding: 8px 4px; border-bottom: 1px solid #eee; }
        .copyable { background-color: #e8f5e9; color: #2e7d32; border-radius: 6px; font-weight: bold; cursor: pointer; padding: 8px 4px; display: block; }
        .copyable:active { background-color: #c8e6c9; }
    </style>
</head>
<body>

    <div id="toast" class="toast">已复制到剪贴板</div>

    <div class="card">
        <h2>批次计算器</h2>
        <div class="form-group">
            <label>下限值 (a):</label>
            <input type="number" step="any" id="input_a" placeholder="实数 a > 0">
        </div>
        <div class="form-group">
            <label>上限值 (b):</label>
            <input type="number" step="any" id="input_b" placeholder="实数 b > a">
        </div>
        <div class="form-group">
            <label>总批数 (x):</label>
            <input type="number" pattern="[0-9]*" id="input_x" placeholder="整数 x > 0">
        </div>
        <div class="form-group">
            <label>小数位数 (w):</label>
            <input type="number" pattern="[0-9]*" id="input_w" placeholder="截断位数 (可留空)">
        </div>
        <div class="form-group">
            <label>本金 (m):</label>
            <input type="number" step="any" id="input_m" placeholder="本金 m (可留空)">
        </div>
        <button class="btn-calc" onclick="calculate()">开始计算</button>
    </div>

    <div class="card">
        <div class="tip">提示：点击绿色数值单元格可自动复制</div>
        <table>
            <thead>
                <tr>
                    <th style="width: 25%;">批次 (i)</th>
                    <th style="width: 37.5%;">取值 (r)</th>
                    <th style="width: 37.5%;">买入额 (n)</th>
                </tr>
            </thead>
            <tbody id="result_body">
                <tr><td colspan="3" style="color:#999; padding: 16px;">暂无计算数据</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // 注册 PWA 实现完全离线使用
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'batch-calc-v1';
                self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./']))));
                self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        function copyText(val, name) {
            if (val === '-') return;
            navigator.clipboard.writeText(val).then(() => {
                showToast(`已复制 ${name}: ${val}`);
            }).catch(() => {
                showToast(`复制失败，请手动复制`);
            });
        }

        function truncateDecimal(valFloat, decimals) {
            let rawStr = valFloat.toFixed(12).replace(/0+$/, '').replace(/\.$/, '');
            if (decimals === null || decimals === undefined) return rawStr;

            if (rawStr.includes('.')) {
                let [integerPart, decimalPart] = rawStr.split('.');
                if (decimals === 0) return integerPart;
                decimalPart = decimalPart.padEnd(decimals, '0').slice(0, decimals);
                return `${integerPart}.${decimalPart}`;
            } else {
                if (decimals === 0) return rawStr;
                return `${rawStr}.` + '0'.repeat(decimals);
            }
        }

        function calculate() {
            const aStr = document.getElementById('input_a').value.trim();
            const bStr = document.getElementById('input_b').value.trim();
            const xStr = document.getElementById('input_x').value.trim();
            const wStr = document.getElementById('input_w').value.trim();
            const mStr = document.getElementById('input_m').value.trim();

            const a = parseFloat(aStr);
            const b = parseFloat(bStr);
            const x = parseInt(xStr, 10);

            if (isNaN(a) || isNaN(b) || isNaN(x)) {
                alert('请正确填写 a, b, x！');
                return;
            }
            if (a <= 0 || b <= a || x <= 0) {
                alert('输入需满足：a > 0, b > a, x > 0');
                return;
            }

            let wVal = null;
            if (wStr !== "") {
                wVal = parseInt(wStr, 10);
                if (isNaN(wVal) || wVal < 0) {
                    alert('小数位数 w 必须 >= 0');
                    return;
                }
            }

            let mVal = null;
            if (mStr !== "") {
                mVal = parseFloat(mStr);
                if (isNaN(mVal) || mVal <= 0) {
                    alert('本金 m 必须 > 0');
                    return;
                }
            }

            const nVal = mVal !== null ? (mVal / x) : null;
            const tbody = document.getElementById('result_body');
            tbody.innerHTML = '';

            for (let i = 0; i < x; i++) {
                const rVal = (x === 1) ? a : a + ((b - a) / (x - 1)) * i;
                const rStr = truncateDecimal(rVal, wVal);
                const nStr = nVal !== null ? nVal.toFixed(10).replace(/0+$/, '').replace(/\.$/, '') : "-";

                const tr = document.createElement('tr');

                // 批次 i
                const tdI = document.createElement('td');
                tdI.innerText = i;
                tr.appendChild(tdI);

                // 取值 r
                const tdR = document.createElement('td');
                tdR.innerHTML = `<span class="copyable" onclick="copyText('${rStr}', 'r')">${rStr}</span>`;
                tr.appendChild(tdR);

                // 买入额 n
                const tdN = document.createElement('td');
                if (nStr !== "-") {
                    tdN.innerHTML = `<span class="copyable" onclick="copyText('${nStr}', 'n')">${nStr}</span>`;
                } else {
                    tdN.innerText = "-";
                }
                tr.appendChild(tdN);

                tbody.appendChild(tr);
            }
        }
    </script>
</body>
</html>
